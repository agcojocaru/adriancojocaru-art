<style>

:root {
  --bg: #f9f8f6;
  --ink: #1a1916;
  --mid: #8a867c;
  --faint: #ddd9d0;
  --paper: #ffffff;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --type: 'Courier New', Courier, monospace;
  --nav-h: 48px;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0 }
html { height: 100% }
body {
  font-family: var(--type);
  font-size: 0.75rem;
  background: var(--bg);
  color: var(--ink);
  letter-spacing: 0.01em;
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
a { color: inherit; text-decoration: none }
button { background: none; border: none; cursor: pointer; font: inherit; color: inherit }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  height: var(--nav-h);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem;
  background: var(--bg);
  border-bottom: 1px solid var(--faint);
}
.nav-name {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  letter-spacing: 0.05em;
  opacity: 0.88;
  transition: opacity 0.2s;
}
.nav-name:hover { opacity: 1 }
.nav-back {
  font-size: 0.64rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mid);
  transition: color 0.2s;
}
.nav-back:hover { color: var(--ink) }

/* LAYOUT */
.page-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: calc(var(--nav-h) + 3rem) 2rem 4rem;
}
.newsletter-container {
  width: 100%;
  max-width: 440px;
}

/* HEADER */
.nl-label {
  font-size: 0.56rem;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 1.8rem;
}
.nl-title {
  font-family: var(--serif);
  font-size: clamp(2rem, 5vw, 2.8rem);
  font-weight: 300;
  font-style: italic;
  line-height: 1.1;
  margin-bottom: 1.5rem;
}
.nl-desc {
  font-family: var(--serif);
  font-size: 1rem;
  font-weight: 300;
  line-height: 1.8;
  color: #3a3833;
  margin-bottom: 3rem;
}

/* FORM */
.form-field {
  margin-bottom: 1.5rem;
}
.form-label {
  display: block;
  font-size: 0.56rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mid);
  margin-bottom: 0.4rem;
}
.form-input {
  width: 100%;
  background: transparent;
  border: none;
  border-bottom: 1px solid var(--faint);
  font-family: var(--type);
  font-size: 0.74rem;
  color: var(--ink);
  padding: 0.5rem 0;
  outline: none;
  transition: border-color 0.2s;
  letter-spacing: 0.01em;
}
.form-input:focus {
  border-bottom-color: var(--ink);
}
.form-input::placeholder {
  color: var(--faint);
}
.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}
.form-submit {
  font-family: var(--type);
  font-size: 0.58rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  border: 1px solid var(--ink);
  padding: 0.7rem 2rem;
  cursor: pointer;
  transition: all 0.25s;
  margin-top: 0.5rem;
  background: transparent;
  color: var(--ink);
}
.form-submit:hover {
  background: var(--ink);
  color: var(--bg);
}
.form-note {
  font-size: 0.58rem;
  color: var(--mid);
  margin-top: 1.2rem;
  letter-spacing: 0.06em;
  line-height: 1.7;
}

/* DIVIDER LINE */
.nl-divider {
  width: 40px;
  height: 1px;
  background: var(--faint);
  margin-bottom: 1.8rem;
}

/* FOOTER */
.nl-footer {
  text-align: center;
  padding: 2rem;
  font-size: 0.56rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mid);
  border-top: 1px solid var(--faint);
}
.nl-footer a {
  transition: color 0.2s;
}
.nl-footer a:hover {
  color: var(--ink);
}

/* SUCCESS STATE */
.form-success {
  display: none;
  padding: 2rem 0;
}
.form-success-title {
  font-family: var(--serif);
  font-size: 1.4rem;
  font-weight: 300;
  font-style: italic;
  margin-bottom: 0.8rem;
}
.form-success-text {
  font-size: 0.72rem;
  color: var(--mid);
  line-height: 1.75;
}

/* MOBILE */
@media (max-width: 768px) {
  nav { padding: 0 1.2rem }
  .page-wrap {
    padding: calc(var(--nav-h) + 2rem) 1.4rem 3rem;
    align-items: flex-start;
  }
  .nl-title {
    font-size: 2rem;
  }
  .nl-desc {
    margin-bottom: 2rem;
  }
  .form-row {
    grid-template-columns: 1fr;
    gap: 0;
  }
}

</style>
</head>

<!-- NAV -->
<nav>

</nav>

<!-- CONTENT -->
<div class="page-wrap">
